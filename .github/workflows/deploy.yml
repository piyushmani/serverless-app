name: CI/CD Pipeline with LocalStack

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # STAGE 1: Lint
  build:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node with cache
        uses: ./.github/actions/setup-node-with-cache
        
      - name: Run linting
        run: npm run lint
  
  # STAGE 2: TEST
  test:
    name: Unit & Integration Tests
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node with cache
        uses: ./.github/actions/setup-node-with-cache
        
      - name: Run unit tests
        run: echo "hello unit test"
      
      - name: Start LocalStack and setup resources
        run: |
          chmod +x ./scripts/start-localstack.sh
          npm run ci:start-localstack
      
      - name: Run integration tests with LocalStack
        env:
          IS_LOCAL: "true"
          LOCALSTACK_HOSTNAME: "localhost"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: echo "hello integration test test"
  
  # STAGE 3: DEPLOY (To LocalStack)
  deploy:
    name: Deploy to LocalStack
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node with cache
        uses: ./.github/actions/setup-node-with-cache
      
      - name: Start LocalStack environment
        run: |
          chmod +x ./scripts/start-localstack.sh
          npm run ci:start-localstack
      
      - name: Deploy to LocalStack
        run: |
          chmod +x ./scripts/deploy-localstack.sh
          npm run ci:deploy-localstack
      
      - name: Verify deployment
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          # List deployed resources
          echo "Listing Lambda functions..."
          aws --endpoint-url=http://localhost:4566 lambda list-functions
          
          echo "Listing S3 buckets..."
          aws --endpoint-url=http://localhost:4566 s3 ls
          
          echo "Listing DynamoDB tables..."
          aws --endpoint-url=http://localhost:4566 dynamodb list-tables
          
          echo "Listing SQS queues..."
          aws --endpoint-url=http://localhost:4566 sqs list-queues
          
          echo "Listing SNS topics..."
          aws --endpoint-url=http://localhost:4566 sns list-topics
