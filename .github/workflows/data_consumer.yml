name: Data Consumer

on:
  workflow_run:
    workflows: ["Data Producer"]
    types:
      - completed

jobs:
  process-data:
    runs-on: ubuntu-latest
    # Only run if the producer workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Download artifacts from producer workflow
      uses: actions/download-artifact@v4
      with:
        # Download from the specific workflow run that triggered this workflow
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        name: build-info
        path: output/build-info.json
        
    - name: Process JSON data
      run: |
        echo "Processing downloaded JSON data..."
        ls output
        cat output/build-info.json
        # Check what was downloaded
        echo "Downloaded files:"
        find ./downloaded-data -type f -name "*.json" | sort
        
        
    - name: Create summary
      run: |
        echo "## Data Consumer Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Source workflow: ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Source run ID: ${{ github.event.workflow_run.id }}" >> $GITHUB_STEP_SUMMARY

  # Optional: Handle failed producer workflow
  handle-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
    - name: Handle producer failure
      run: |
        echo "Producer workflow failed. Taking remedial action..."
        echo "Failed workflow: ${{ github.event.workflow_run.name }}"
        echo "Run ID: ${{ github.event.workflow_run.id }}"
        echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
        
        # Could send notifications, create issues, etc.
        echo "## Producer Workflow Failed" >> $GITHUB_STEP_SUMMARY
        echo "The data producer workflow failed and no data was processed." >> $GITHUB_STEP_SUMMARY
        echo "Please check the failed workflow run for details." >> $GITHUB_STEP_SUMMARY
